<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In - AnimateWell</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/sign.css">
</head>

<body>

    <div class="bg-container">
        <div class="login-card">
            <h1 class="login-title">Sign In</h1>

            <form>
                <div class="input-group mb-3">
                    <span class="input-group-text"><i class="bi bi-person"></i></span>
                    <input type="text" class="form-control" id="user_input" placeholder="Username or Email" required>
                </div>

                <div class="input-group mb-4">
                    <span class="input-group-text"><i class="bi bi-lock"></i></span>
                    <input type="password" id="user_password" class="form-control" placeholder="Password" required>
                    <span class="input-group-text toggle-password" onclick="toggle('user_password', 'eyeIcon')" style="cursor:pointer;">
                        <i class="bi bi-eye-slash" id="eyeIcon"></i>
                    </span>
                </div>

                <button type="submit" class="btn btn-signup" onclick="signIn(event)">Sign in</button>

                <div class="divider"><span>or</span></div>

                <button type="button" class="btn btn-google" onclick="googleCallback()">
                    <img src="https://fonts.gstatic.com/s/i/productlogos/googleg/v6/24px.svg" width="18"
                        alt="Google Logo">
                    Continue with Google
                </button>

                <div class="signup-text">
                    Don't have an Account? <a href="Sign-up.html">Sign up</a>
                </div>
            </form>
        </div>

        <footer>
            &copy; 2026 ANIMATEWELL COMPANY. All Rights Reserved.
        </footer>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/auth.js"></script>
</body>

</html>
