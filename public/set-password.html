<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Step 2 - AnimateWell</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/sign.css">
</head>

<body>

    <div class="bg-container">
        <div class="login-card">
            <h1 class="login-title">Set-up The Following</h1>

            <form>
                <div class="input-group mb-3">
                    <span class="input-group-text"><i class="bi bi-building"></i></span>
                    <select class="form-control" id="user_department" required>
                        <option value="" disabled selected>Select Department</option>
                        <option value="4">Arts</option>
                        <option value="5">Model</option>
                        <option value="3">Photo</option>
                        <option value="2">Video</option>
                    </select>
                </div>

                <div class="input-group mb-3">
                    <span class="input-group-text"><i class="bi bi-lock"></i></span>
                    <input type="password" id="user_password" class="form-control" placeholder="Password" required>
                    <span class="input-group-text" style="cursor:pointer;" onclick="toggle('user_password', 'eye1')">
                        <i class="bi bi-eye-slash" id="eye1"></i>
                    </span>
                </div>

                <div class="input-group mb-4">
                    <span class="input-group-text"><i class="bi bi-shield-check"></i></span>
                    <input type="password" id="confirm_password" class="form-control" placeholder="Confirm Password" required>
                    <span class="input-group-text" style="cursor:pointer;" onclick="toggle('confirm_password', 'eye2')">
                        <i class="bi bi-eye-slash" id="eye2"></i>
                    </span>
                </div>

                <button type="submit" class="btn btn-signup" onclick="update(event)">Continue</button>
            </form>
        </div>

        <footer>
            &copy; 2026 ANIMATEWELL COMPANY. All Rights Reserved.
        </footer>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/auth.js"></script>
</body>

</html>
